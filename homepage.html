<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/homepage.css">
    <title>Homepage-MT-MadaTell</title>
</head>

<body>

    <header>
        <div class="logoSection">
            <img class="logo" src="./assets/image/Logo/MT.png" alt="">
            <h1>MT-MadaTell</h1>
        </div>

        <div class="menu">
            <h2>Home</h2>
            <h2>About</h2>
        </div>
    </header>

    <main>

        <div class="blank"></div>
        <div class="body-1">
        <section class="travel-welcome">
            <h2>Welcome to MadaTell</h2>
            <p>
                Looking for a holiday destination in Madagascar?
                MadaTell offers suggestions tailored to your preferences and budget.
            </p>
        </section>

        <section class="login-section">

            <div class="login-title">
                <h1>MT-MadaTell</h1>
                <h2 class="LoginText">Login</h2>
            </div>

            <div class="login-form">
                <form action="">
                    <h2>Email:</h2>
                    <input class="accountLogin" type="text" placeholder="Email">

                    <h2>Password:</h2>
                    <input class="password" type="password" placeholder="Password">

                    <button class="btnLogin">Log in</button>
                </form>
            </div>

            <div class="btnAccount">
                <button class="btnForgotPwd">Forgot password?</button>
                <button class="btnSignUp">Sign up</button>
            </div>

        </section>
    </div>
    </main>

    <footer></footer>

</body>
</html>
